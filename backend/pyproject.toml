[project]
name = "dess-digital-backend"
version = "0.1.0"
description = "dess-digital API and background worker"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic[vertex]>=2.7.0",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "openai>=3.48.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Tell Ruff that these FastAPI function calls are safe to use in default arguments
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
