
name: dess-digital

x-logging: &logging
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-backend: &backend
  image: ${REGISTRY:-dess-digital}/dess-digital-api:${IMAGE_TAG:-latest}
  build: ./backend
  restart: unless-stopped
  <<: *logging
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dess}:${POSTGRES_PASSWORD:-dess}@db:5432/${POSTGRES_DB:-dess}
  volumes:
    - ${DATA_DIR:-./data}/files:/data/files
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dess}
      POSTGRES_DB: ${POSTGRES_DB:-dess}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dess} -d $${POSTGRES_DB:-dess}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${REGISTRY:-dess-digital}/dess-digital-web:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    <<: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${DATA_DIR:-./data}/caddy:/data
    depends_on:
      - api
