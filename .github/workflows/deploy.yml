name: "Build, push to GAR and deploy to VM"

on:
  push:
    branches:
      - "development"

env:
  PROJECT_ID: "${{ secrets.GCP_PROJECT_NAME }}"
  GAR_LOCATION: "europe-west2"
  REGISTRY: "europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_NAME }}/${{ secrets.GCP_PROJECT_NAME }}-gcr"
  VM: "dess-digital"
  VM_ZONE: "europe-west2-a"
  WORKLOAD_IDENTITY_PROVIDER: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions-provider"

jobs:
  build-push-deploy:
    name: "Build, Push, and Deploy"
    environment: "development"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: "auth"
        name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ env.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "tf-provision@${{ secrets.GCP_PROJECT_NAME }}.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 363.0.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Docker Auth"
        uses: "docker/login-action@v3"
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"
          registry: "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      # Tags must match the image names in docker-compose.yml.
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/dess-digital-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/dess-digital-web:${{ github.sha }}

      - name: Deploy to VM
        run: |
          cat > .env <<'EOF'
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_TAG=${{ github.sha }}
          DATA_DIR=/mnt/disks/data
          SITE_ADDRESS=${{ vars.SITE_ADDRESS }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          MINUTES_ROUTES=${{ vars.MINUTES_ROUTES || 'false' }}
          LLM_PROVIDER=${{ vars.LLM_PROVIDER }}
          LLM_MODEL=${{ vars.LLM_MODEL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          GCP_PROJECT=${{ secrets.GCP_PROJECT_NAME }}
          GCP_LOCATION=${{ vars.GCP_LOCATION || 'global' }}
          AZURE_ENDPOINT=${{ vars.AZURE_ENDPOINT }}
          EOF

          gcloud --version
          gcloud compute scp docker-compose.yml .env "$VM":~/ --zone "$VM_ZONE" --tunnel-through-iap --quiet

          echo "${{ steps.auth.outputs.access_token }}" | gcloud compute ssh "$VM" --zone "$VM_ZONE" --tunnel-through-iap --quiet --command "
            set -e
            chmod 600 .env
            sudo docker login -u oauth2accesstoken --password-stdin https://${{ env.GAR_LOCATION }}-docker.pkg.dev
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -af
          "
